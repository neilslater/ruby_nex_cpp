name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        ruby-version:
          - '3.3'
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Compile native extension
        run: bundle exec rake compile
      - name: Run specs
        run: bundle exec rspec

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop
      - name: Audit dependencies
        run: bundle exec bundle-audit check --update
      - name: Check API documentation
        run: bundle exec yard stats --list-undoc --exclude 'ext/.*'
      - name: Build gem
        run: bundle exec gem build baz.gemspec

  native-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check:
          - lint
          - coverage
          - sanitize
    steps:
      - uses: actions/checkout@v6
      - name: Install C++ coverage tools
        if: matrix.check == 'coverage'
        run: sudo apt-get update && sudo apt-get install -y gcovr
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Show configured C++ compiler
        run: ruby -rrbconfig -e 'puts RbConfig::CONFIG.fetch("CXX")'
      - name: Run native quality check
        run: bundle exec rake c:${{ matrix.check }}
      - name: Add C++ coverage summary
        if: matrix.check == 'coverage' && always()
        run: |
          if test -f coverage/cpp/summary.txt; then
            cat coverage/cpp/summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload C++ coverage report
        if: matrix.check == 'coverage' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-coverage
          path: coverage/cpp
          retention-days: 14
          if-no-files-found: warn
